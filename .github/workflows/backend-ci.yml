name: Backend TypeScript CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  typescript:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Verificacion de tipos
        run: npm run typecheck
      - name: Compilar API
        run: npm run build
      - name: Pruebas de tickets firmados AURA
        run: npm run test:aura
