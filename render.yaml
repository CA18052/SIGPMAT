# Aplicación completa: Fastify sirve la API y el frontend compilado.
services:
  - type: web
    name: sigpmat-demo
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev --prefix backend && npm install --include=dev --prefix frontend --no-audit --no-fund && npm run build --prefix frontend && npm run build --prefix backend
    startCommand: node backend/dist/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      # GroqCloud Free es la opción predeterminada de AURA.
      - key: GROQ_API_KEY
        sync: false
      - key: AURA_PROVEEDOR
        value: groq
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      # OpenAI es opcional y nunca se usa sin AURA_PROVEEDOR=openai.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
